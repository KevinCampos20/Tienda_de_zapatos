<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Recuperar Contraseña - MIMO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/Styles.css">
    <meta name="theme-color" content="#0B2239">
</head>
<body>

    <header>
        <div class="logo">MIMO <span>Pasos para toda tu vida</span></div>
        <nav>
            <ul>
                <li><a href="login.html">Volver al Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-container">
        <h2>Recuperar Contraseña</h2>
        <p style="text-align: center; color: var(--azul-profundo); margin-bottom: 1.5rem; font-size: 0.95rem;">
            Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
        </p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="correo-recuperar">Correo electrónico</label>
                <input type="email" id="correo-recuperar" name="correo-recuperar" placeholder="tucorreo@ejemplo.com" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Enviar enlace de recuperación</button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; color: var(--azul-profundo);">
            ¿Ya la recordaste? <a href="login.html" style="color: var(--dorado); font-weight: 600;">Inicia sesión aquí</a>
        </p>
    </main>

    <footer>
        <p>© 2026 MIMO. Pasos para toda tu vida.</p>
    </footer>

</body>
</html>
