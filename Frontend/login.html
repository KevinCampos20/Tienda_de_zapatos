<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Iniciar Sesión - MIMO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/Styles.css">
    <meta name="theme-color" content="#0B2239">
</head>
<body>

    <header>
        <a class="logo" href="index.html">MIMO <span>Pasos para toda tu vida</span></a>
        <nav>
            <ul>
                <li><a href="index.html">Catálogo</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-container">
        <h2>Iniciar Sesión</h2>
        <form id="form-login" novalidate>
            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <p id="form-error" class="form-error" role="alert" style="display:none;"></p>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Ingresar</button>
        </form>

        <p style="text-align: center; margin-top: 1rem;">
            <a href="recuperar-contrasena.html" style="color: var(--azul-profundo); font-size: 0.9rem;">¿Olvidaste tu contraseña?</a>
        </p>

        <p style="text-align: center; margin-top: 0.75rem;">
            <a href="admin-login.html" style="color: var(--azul-profundo); font-size: 0.85rem;">Acceso administrador</a>
        </p>

        <p style="text-align: center; margin-top: 1rem; color: var(--azul-profundo);">
            ¿No tienes cuenta? <a href="registro.html" style="color: var(--dorado); font-weight: 600;">Regístrate aquí</a>
        </p>
    </main>

    <footer>
        <p>© 2026 MIMO. Pasos para toda tu vida.</p>
    </footer>

    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
</body>
</html>
